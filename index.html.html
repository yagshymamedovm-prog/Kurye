<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <title>ŞäherMarket Kurýer PRO</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#060a13;--card:#121c30;--soft:#1b2842;--ink:#f8fafc;--sub:#94a3b8;--border:rgba(148,163,184,.14);--grad:linear-gradient(135deg,#10b981,#0284c7)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",sans-serif;font-size:13.5px}
    .shell{max-width:540px;margin:0 auto;padding:14px 14px 70px}
    .top{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
    .row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
    .pill{border:1px solid var(--border);background:var(--soft);color:#fff;padding:7px 11px;border-radius:10px;font-size:11.5px;font-weight:800;cursor:pointer}
    .pill.on{background:rgba(16,185,129,.2);color:#34d399;border-color:rgba(16,185,129,.45)}
    .pill.route{background:linear-gradient(135deg,#2563eb,#06b6d4);border:none;color:#fff;width:100%;height:42px;font-size:13px}
    .zimmet{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .zcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:11px;display:flex;flex-direction:column;gap:9px}
    .info{background:#090f1d;border-radius:11px;padding:9px 11px;font-size:12px;display:flex;flex-direction:column;gap:3px}
    .btns{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .btn{height:40px;border:none;border-radius:11px;font-size:12.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;color:#fff}
    .btn.map{background:#2563eb}.btn.call{background:var(--soft)}.btn.go{grid-column:span 2;background:var(--grad)}
    .empty{background:var(--card);border:1px dashed var(--border);border-radius:18px;padding:40px 18px;text-align:center;color:var(--sub)}
    .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;display:none}
    .toast.show{display:block}
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <div class="row">
        <div><h1 style="font-size:17px;font-weight:800;">🛵 ŞäherMarket Kurýer PRO</h1><div style="font-size:11px;color:var(--sub);">Akylly rota, PIN tassyklama we nagt zimmet</div></div>
        <div style="display:flex;gap:6px;">
          <button type="button" class="pill on" id="statusBtn">🟢 Işde</button>
          <button type="button" class="pill" id="vehBtn">🛵 Motor</button>
        </div>
      </div>
      <button type="button" class="pill route" id="smartRouteBtn">🧭 Iň gysga ugry çyz (Akylly Rota • Karta)</button>
    </div>
    <div class="zimmet">
      <div class="zcard"><div style="font-size:11px;color:var(--sub);">Elindäki işjeň paket</div><div id="zPkg" style="font-size:20px;font-weight:800;color:#60a5fa;">0</div></div>
      <div class="zcard"><div style="font-size:11px;color:var(--sub);">Ýygnalan Nagt (Zimmet)</div><div id="zCash" style="font-size:20px;font-weight:800;color:#34d399;">0 m.</div></div>
    </div>
    <div id="list"></div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function(){
      const sb = window.supabase.createClient('https://zkypuqmwovjuuplirzig.supabase.co', 'sb_publishable_Rhlt7E7dYumty3PpE6Sp6Q_AzkHOp-l');
      const esc = s => String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
      function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
      let orders = [], avail = true, vehIdx = 0;
      const vehs = ['🛵 Motor', '🚗 Awtoulag', '🚲 Tigir'];

      async function load(){
        const { data } = await sb.from('orders').select('*').in('status', ['preparing','onway']).order('created_at', { ascending:true });
        orders = data || [];
        render();
      }

      // Nearest-neighbor Smart Route Sorting + Google Maps Multi-Stop URL
      function runSmartRoute(){
        if (!orders.length) { toast('Häzir eltilmeli sargyt ýok'); return; }
        const withCoords = orders.filter(o => o.lat && o.lng);
        const startSort = (curLat, curLng) => {
          const rem = [...orders], sorted = [];
          let lat = curLat, lng = curLng;
          while (rem.length) {
            let bestIdx = 0, bestD = Infinity;
            rem.forEach((o, i) => {
              if (o.lat && o.lng) {
                const d = Math.hypot(o.lat - lat, o.lng - lng);
                if (d < bestD) { bestD = d; bestIdx = i; }
              }
            });
            const pick = rem.splice(bestIdx, 1)[0];
            sorted.push(pick);
            if (pick.lat && pick.lng) { lat = pick.lat; lng = pick.lng; }
          }
          orders = sorted; render();
          const stops = sorted.map(o => (o.lat && o.lng) ? (o.lat + ',' + o.lng) : encodeURIComponent(o.address));
          const dest = stops[stops.length - 1];
          const wps = stops.slice(0, -1).join('|');
          const url = 'https://www.google.com/maps/dir/?api=1&destination=' + dest + (wps ? ('&waypoints=' + wps) : '') + '&travelmode=driving';
          toast('🧭 Iň gysga ugur tertiplendi — Karta açylýar!');
          window.open(url, '_blank');
        };
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(p => startSort(p.coords.latitude, p.coords.longitude), () => startSort(37.9601, 58.3261));
        } else startSort(37.9601, 58.3261);
      }

      function render(){
        document.getElementById('zPkg').textContent = orders.length;
        const cashSum = orders.filter(o => o.pay_method !== 'card').reduce((s, o) => s + Number(o.total || 0), 0);
        document.getElementById('zCash').textContent = cashSum.toLocaleString('tr-TR') + ' m.';
        const el = document.getElementById('list');
        if (!orders.length) { el.innerHTML = '<div class="empty">🛵 Häzir eltilmeli sargyt ýok.</div>'; return; }
        el.innerHTML = orders.map((o, idx) => {
          const mapUrl = (o.lat && o.lng) ? ('https://maps.google.com/?q=' + o.lat + ',' + o.lng) : ('https://maps.google.com/?q=' + encodeURIComponent(o.address));
          const isWay = o.status === 'onway';
          return '<div class="card">' +
            '<div class="row"><div><strong>#' + (idx+1) + ' • ' + esc(o.store_name || o.store_id) + '</strong><div style="font-size:11.5px;color:var(--sub);">' + esc(o.code) + ' • <b>' + Number(o.total).toLocaleString('tr-TR') + ' m.</b>' + (o.courier_tip ? (' (+' + o.courier_tip + 'm çaýpuly)') : '') + '</div></div><span class="pill ' + (isWay?'on':'') + '">' + (isWay?'🛵 Ýolda':'🔥 Taýýar') + '</span></div>' +
            '<div class="info"><div>👤 <b>' + esc(o.customer_name) + '</b> • ' + esc(o.customer_phone) + '</div><div>📍 ' + esc(o.address) + '</div>' + (o.contactless ? '<div style="color:#60a5fa;">🚪 Gapynyň öňünde goýmaly (Temassyz)</div>' : '') + (o.note ? '<div style="color:#fcd34d;">📝 ' + esc(o.note) + '</div>' : '') + '</div>' +
            '<div class="btns">' +
              '<a class="btn map" href="' + mapUrl + '" target="_blank">🗺️ Karta</a>' +
              '<a class="btn call" href="tel:' + esc(String(o.customer_phone).replace(/\s/g,'')) + '">📞 Jaň et</a>' +
              '<button type="button" class="btn go" data-code="' + esc(o.code) + '" data-pin="' + esc(o.delivery_pin || '') + '" data-next="' + (isWay?'delivered':'onway') + '">' + (isWay?'✅ Müşderä gowşuryldy (PIN / Eltildi)':'🛵 Sargydy aldym — Ýola çyk') + '</button>' +
            '</div></div>';
        }).join('');
      }

      document.getElementById('statusBtn').addEventListener('click', e => { avail = !avail; e.target.textContent = avail ? '🟢 Işde' : '🟡 Arakesmede'; e.target.classList.toggle('on', avail); });
      document.getElementById('vehBtn').addEventListener('click', e => { vehIdx = (vehIdx + 1) % vehs.length; e.target.textContent = vehs[vehIdx]; });
      document.getElementById('smartRouteBtn').addEventListener('click', runSmartRoute);

      document.getElementById('list').addEventListener('click', async e => {
        const b = e.target.closest('[data-code]'); if (!b) return;
        const next = b.getAttribute('data-next'), reqPin = b.getAttribute('data-pin');
        if (next === 'delivered' && reqPin) {
          const entered = prompt('Müşderidäki 4 sanly teslimat PIN koduny giriň:');
          if (entered !== reqPin) { toast('❌ PIN kod nädogry!'); return; }
        }
        await sb.from('orders').update({ status: next }).eq('code', b.getAttribute('data-code'));
        toast(next === 'delivered' ? 'Eltildi ✓' : 'Ýola çykyldy 🛵');
        load();
      });

      sb.channel('courier-v7').on('postgres_changes', { event:'*', schema:'public', table:'orders' }, () => load()).subscribe();
      load();
    })();
  </script>
</body>
</html>
