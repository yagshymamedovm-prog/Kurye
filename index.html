<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" />
  <title>ŞäherMarket Kurýer — Eltip Bermek Ekrany</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0b1120;--card:#182235;--soft:#22304a;--ink:#f8fafc;--sub:#94a3b8;--border:rgba(255,255,255,.09);--grad:linear-gradient(135deg,#10b981,#0284c7)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",sans-serif;font-size:14px}
    .shell{max-width:480px;margin:0 auto;padding:14px 14px 60px}
    .top{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:13px 15px;margin-bottom:14px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:15px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
    .pill{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px}
    .p-prep{background:rgba(249,115,22,.2);color:#fdba74}
    .p-way{background:rgba(139,92,246,.22);color:#c4b5fd}
    .info{background:rgba(11,17,32,.55);border-radius:12px;padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
    .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btn{height:42px;border:none;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:#fff}
    .btn.map{background:#2563eb}.btn.call{background:var(--soft)}.btn.go{grid-column:span 2;background:var(--grad)}
    .empty{background:var(--card);border:1px dashed var(--border);border-radius:20px;padding:44px 18px;text-align:center;color:var(--sub)}
    .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;display:none}
    .toast.show{display:block}
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <div><h1 style="font-size:17px;font-weight:800;">🛵 ŞäherMarket Kurýer</h1><div style="font-size:11px;color:var(--sub);">● Taýýar we ýoldaky sargytlar</div></div>
      <button type="button" id="refBtn" style="border:none;background:var(--soft);color:#fff;padding:8px 12px;border-radius:11px;font-weight:800;cursor:pointer;">🔄</button>
    </div>
    <div id="list"></div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function(){
      const sb = window.supabase.createClient('https://zkypuqmwovjuuplirzig.supabase.co', 'sb_publishable_Rhlt7E7dYumty3PpE6Sp6Q_AzkHOp-l');
      const esc = s => String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
      function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
      let orders = [];

      async function load(){
        const { data } = await sb.from('orders').select('*').in('status', ['preparing','onway']).order('created_at', { ascending:true });
        orders = data || [];
        render();
      }

      function render(){
        const el = document.getElementById('list');
        if(!orders.length){ el.innerHTML = '<div class="empty"><div style="font-size:38px;margin-bottom:8px;">🛵</div><strong>Häzir eltilmeli sargyt ýok</strong><p style="font-size:12px;margin-top:4px;">Dükan sargydy «Taýýarlanýar» edende şu ýerde derrew peýda bolar.</p></div>'; return; }
        el.innerHTML = orders.map(o => {
          const mapUrl = (o.lat && o.lng) ? ('https://maps.google.com/?q=' + o.lat + ',' + o.lng) : ('https://maps.google.com/?q=' + encodeURIComponent(o.address));
          const isWay = o.status === 'onway';
          return '<div class="card">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;"><div><strong style="font-size:15px;">' + esc(o.store_name || o.store_id) + '</strong><div style="font-size:11.5px;color:var(--sub);">' + esc(o.code) + ' • ' + Number(o.total).toLocaleString('tr-TR') + ' m. (' + (o.pay_method==='card'?'Kart':'Nagt') + ')</div></div><span class="pill ' + (isWay?'p-way':'p-prep') + '">' + (isWay?'🛵 Ýolda':'🔥 Taýýar') + '</span></div>' +
            '<div class="info"><div>👤 <strong>' + esc(o.customer_name) + '</strong> • ' + esc(o.customer_phone) + '</div><div>📍 ' + esc(o.address) + '</div>' + (o.note?'<div style="color:#fcd34d;">📝 ' + esc(o.note) + '</div>':'') + '</div>' +
            '<div class="btns">' +
              '<a class="btn map" href="' + mapUrl + '" target="_blank">🗺️ Karta</a>' +
              '<a class="btn call" href="tel:' + esc(String(o.customer_phone).replace(/\s/g,'')) + '">📞 Jaň et</a>' +
              '<button type="button" class="btn go" data-code="' + esc(o.code) + '" data-next="' + (isWay?'delivered':'onway') + '">' + (isWay?'✅ Müşderä gowşuryldy (Eltildi)':'🛵 Sargydy aldym — Ýola çyk') + '</button>' +
            '</div></div>';
        }).join('');
      }

      document.getElementById('list').addEventListener('click', async e => {
        const b = e.target.closest('[data-code]'); if(!b) return;
        await sb.from('orders').update({ status: b.getAttribute('data-next') }).eq('code', b.getAttribute('data-code'));
        toast(b.getAttribute('data-next') === 'delivered' ? 'Eltildi ✓' : 'Ýola çykyldy 🛵');
        load();
      });
      document.getElementById('refBtn').addEventListener('click', () => { load(); toast('Täzelendi'); });

      sb.channel('courier-live').on('postgres_changes', { event:'*', schema:'public', table:'orders' }, () => load()).subscribe();
      load();
    })();
  </script>
</body>
</html>
